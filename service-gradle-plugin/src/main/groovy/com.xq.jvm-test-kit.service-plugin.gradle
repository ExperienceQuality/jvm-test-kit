import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.artifacts.repositories.PasswordCredentials
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.MapProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.TaskAction
import org.gradle.api.tasks.testing.Test
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JavaLauncher
import org.gradle.jvm.toolchain.JavaToolchainService
import org.gradle.work.DisableCachingByDefault
import org.springframework.boot.gradle.tasks.bundling.BootJar

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardCopyOption
import java.time.Duration
import java.util.Optional
import java.util.concurrent.ExecutionException
import java.util.concurrent.TimeUnit
import java.util.concurrent.TimeoutException

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

def jvmTestKitService = extensions.create(
        'jvmTestKitService',
        JvmTestKitServiceExtension
)
jvmTestKitService.artifactName.convention(project.name + '.jar')
jvmTestKitService.healthUrl.convention('http://127.0.0.1:8080/actuator/health')
jvmTestKitService.startupTimeout.convention(Duration.ofSeconds(120))
jvmTestKitService.jvmArgs.convention([])
jvmTestKitService.environment.convention([:])

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'XqGitHubPackages'
        url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
        content {
            includeGroup('com.xq')
        }
        credentials(PasswordCredentials) {
            username = providers.environmentVariable('GITHUB_ACTOR').orNull
            password = providers.environmentVariable('GITHUB_TOKEN').orNull
        }
    }
}

def sourceSets = extensions.getByType(SourceSetContainer)
def e2eSourceSet = sourceSets.create('e2e')

dependencies {
    add('testImplementation', 'org.junit.jupiter:junit-jupiter:6.0.0')
    add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher:6.0.0')
    add(e2eSourceSet.implementationConfigurationName, 'org.junit.jupiter:junit-jupiter-api:6.0.0')
    add(e2eSourceSet.implementationConfigurationName, 'com.xq:jvm-test-kit:2.0.0')
    add(e2eSourceSet.runtimeOnlyConfigurationName, 'org.junit.jupiter:junit-jupiter-engine:6.0.0')
    add(e2eSourceSet.runtimeOnlyConfigurationName, 'org.junit.platform:junit-platform-launcher:6.0.0')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def e2eTest = tasks.register('e2eTest', Test) {
    description = 'Runs the JVM Test Kit end-to-end suite against a running service.'
    group = 'verification'
    dependsOn(tasks.named(e2eSourceSet.classesTaskName))
    testClassesDirs = e2eSourceSet.output.classesDirs
    classpath = e2eSourceSet.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

tasks.register('e2e', DefaultTask) {
    description = 'Runs end-to-end tests against the configured service URI.'
    group = 'verification'
    dependsOn(e2eTest)
}

def validateConfiguration = tasks.register(
        'validateJvmTestKitServiceConfiguration',
        ValidateJvmTestKitServiceConfigurationTask
) {
    description = 'Validates JVM Test Kit service convention configuration.'
    group = 'verification'
    artifactName.set(jvmTestKitService.artifactName)
    healthUrl.set(jvmTestKitService.healthUrl)
    startupTimeout.set(jvmTestKitService.startupTimeout)
}

def bootJarTask = tasks.named('bootJar', BootJar)
def packageService = tasks.register('packageService', PackageServiceTask) {
    description = 'Packages the runnable service JAR in the CI artifact layout.'
    group = 'build'
    dependsOn(bootJarTask, validateConfiguration)
    bootJar.set(bootJarTask.flatMap { it.archiveFile })
    outputJar.set(layout.buildDirectory.file(
            jvmTestKitService.artifactName.map { name -> "service/${name}" }
    ))
}

tasks.register('ci', DefaultTask) {
    description = 'Runs checks and produces the packaged service artifact.'
    group = 'verification'
    dependsOn(tasks.named('check'), packageService)
}

def toolchains = extensions.getByType(JavaToolchainService)
def launcher = toolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

def startE2eService = tasks.register('startE2eService', StartE2eServiceTask) {
    description = 'Starts the packaged service and waits for its health endpoint.'
    group = 'verification'
    dependsOn(packageService, validateConfiguration)
    serviceJar.set(packageService.flatMap { it.outputJar })
    javaExecutable.set(launcher.map { JavaLauncher value -> value.executablePath })
    healthUrl.set(jvmTestKitService.healthUrl)
    startupTimeout.set(jvmTestKitService.startupTimeout)
    jvmArgs.set(jvmTestKitService.jvmArgs)
    environment.set(jvmTestKitService.environment)
    pidFile.set(layout.buildDirectory.file('application.pid'))
    logFile.set(layout.buildDirectory.file('application.log'))
}

tasks.register('stopE2eService', StopE2eServiceTask) {
    description = 'Stops the E2E service process started by startE2eService.'
    group = 'verification'
    mustRunAfter(startE2eService)
    serviceJar.set(packageService.flatMap { it.outputJar })
    pidFile.set(layout.buildDirectory.file('application.pid'))
}

abstract class JvmTestKitServiceExtension {
    abstract Property<String> getArtifactName()

    abstract Property<String> getHealthUrl()

    abstract Property<Duration> getStartupTimeout()

    abstract ListProperty<String> getJvmArgs()

    abstract MapProperty<String, String> getEnvironment()
}

final class ServiceConfiguration {
    private static final Duration MAX_STARTUP_TIMEOUT = Duration.ofMinutes(15)

    private ServiceConfiguration() {
    }

    static String validateArtifactName(String artifactName) {
        if (artifactName == null || artifactName.isBlank()) {
            throw new GradleException('jvmTestKitService.artifactName must be a nonblank JAR basename, for example service.jar')
        }
        if (!artifactName.endsWith('.jar')
                || artifactName.contains('/')
                || artifactName.contains('\\')
                || artifactName == '.'
                || artifactName == '..') {
            throw new GradleException('jvmTestKitService.artifactName must be a JAR basename without path segments, for example service.jar: ' + artifactName)
        }
        artifactName
    }

    static URI validateHealthUrl(String healthUrl) {
        URI uri
        try {
            uri = URI.create(healthUrl)
        } catch (IllegalArgumentException exception) {
            throw new GradleException('jvmTestKitService.healthUrl must be an absolute HTTP(S) URL: ' + healthUrl, exception)
        }
        if (!uri.absolute
                || !(uri.scheme.equalsIgnoreCase('http') || uri.scheme.equalsIgnoreCase('https'))
                || uri.host == null
                || uri.userInfo != null
                || uri.query != null
                || uri.fragment != null) {
            throw new GradleException('jvmTestKitService.healthUrl must be an absolute HTTP(S) URL without credentials, query, or fragment: ' + healthUrl)
        }
        uri
    }

    static Duration validateStartupTimeout(Duration timeout) {
        if (timeout == null || timeout.zero || timeout.negative || timeout > MAX_STARTUP_TIMEOUT) {
            throw new GradleException('jvmTestKitService.startupTimeout must be greater than zero and no more than PT15M: ' + timeout)
        }
        timeout
    }
}

@DisableCachingByDefault(because = 'Validation has no output')
abstract class ValidateJvmTestKitServiceConfigurationTask extends DefaultTask {
    @Input
    abstract Property<String> getArtifactName()

    @Input
    abstract Property<String> getHealthUrl()

    @Input
    abstract Property<Duration> getStartupTimeout()

    @TaskAction
    void validate() {
        ServiceConfiguration.validateArtifactName(artifactName.get())
        ServiceConfiguration.validateHealthUrl(healthUrl.get())
        ServiceConfiguration.validateStartupTimeout(startupTimeout.get())
    }
}

@DisableCachingByDefault(because = 'The task only creates the conventional CI artifact copy')
abstract class PackageServiceTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getBootJar()

    @OutputFile
    abstract RegularFileProperty getOutputJar()

    @TaskAction
    void packageService() {
        def source = bootJar.get().asFile.toPath()
        def destination = outputJar.get().asFile.toPath()
        Files.createDirectories(destination.parent)
        Files.copy(source, destination, StandardCopyOption.REPLACE_EXISTING)
    }
}

final class ServiceProcessSupport {
    private ServiceProcessSupport() {
    }

    static Optional<Long> readPid(Path pidFile) {
        if (!Files.exists(pidFile)) {
            return Optional.empty()
        }
        try {
            String value = Files.readString(pidFile, StandardCharsets.UTF_8).trim()
            long pid = Long.parseLong(value)
            if (pid <= 0) {
                throw new NumberFormatException('PID must be positive')
            }
            return Optional.of(pid)
        } catch (IOException | NumberFormatException exception) {
            throw new GradleException("Invalid service PID file ${pidFile}; remove it only after confirming no service process owns it", exception)
        }
    }

    static boolean ownsJar(ProcessHandle handle, Path expectedJar) {
        Optional<String[]> arguments = handle.info().arguments()
        if (arguments.empty) {
            return false
        }
        String[] values = arguments.get()
        for (int index = 0; index < values.length - 1; index++) {
            if (values[index] == '-jar') {
                try {
                    Path actualJar = Path.of(values[index + 1]).toAbsolutePath().normalize()
                    return actualJar == expectedJar.toAbsolutePath().normalize()
                } catch (RuntimeException ignored) {
                    return false
                }
            }
        }
        false
    }

    static void terminate(ProcessHandle handle, Duration gracefulTimeout) {
        if (!handle.alive) {
            return
        }
        handle.destroy()
        if (awaitExit(handle, gracefulTimeout)) {
            return
        }
        handle.destroyForcibly()
        if (!awaitExit(handle, Duration.ofSeconds(5))) {
            throw new GradleException("Service process ${handle.pid()} did not stop after forced termination")
        }
    }

    private static boolean awaitExit(ProcessHandle handle, Duration timeout) {
        try {
            handle.onExit().get(timeout.toMillis(), TimeUnit.MILLISECONDS)
            return true
        } catch (TimeoutException ignored) {
            return false
        } catch (InterruptedException exception) {
            Thread.currentThread().interrupt()
            throw new GradleException("Interrupted while stopping service process ${handle.pid()}", exception)
        } catch (ExecutionException exception) {
            throw new GradleException("Could not observe service process ${handle.pid()} termination", exception)
        }
    }
}

@DisableCachingByDefault(because = 'Starts an external service process')
abstract class StartE2eServiceTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getServiceJar()

    @InputFile
    @PathSensitive(PathSensitivity.ABSOLUTE)
    abstract RegularFileProperty getJavaExecutable()

    @Input
    abstract Property<String> getHealthUrl()

    @Input
    abstract Property<Duration> getStartupTimeout()

    @Input
    abstract ListProperty<String> getJvmArgs()

    @Internal
    abstract MapProperty<String, String> getEnvironment()

    @Internal
    abstract RegularFileProperty getPidFile()

    @Internal
    abstract RegularFileProperty getLogFile()

    @TaskAction
    void startService() {
        Path jar = serviceJar.get().asFile.toPath().toAbsolutePath().normalize()
        URI healthUri = ServiceConfiguration.validateHealthUrl(healthUrl.get())
        Duration timeout = ServiceConfiguration.validateStartupTimeout(startupTimeout.get())
        Path pid = pidFile.get().asFile.toPath()
        Path log = logFile.get().asFile.toPath()

        Optional<Long> recordedPid = ServiceProcessSupport.readPid(pid)
        if (recordedPid.present) {
            long value = recordedPid.get()
            Optional<ProcessHandle> existing = ProcessHandle.of(value)
            if (existing.present && existing.get().alive) {
                if (ServiceProcessSupport.ownsJar(existing.get(), jar)) {
                    throw new GradleException("E2E service is already running with PID ${value} from ${jar}")
                }
                throw new GradleException("Refusing to replace PID file owned by another live process: ${pid}")
            }
            deletePid(pid)
        }

        try {
            Files.createDirectories(pid.parent)
            Files.createDirectories(log.parent)
        } catch (IOException exception) {
            throw new GradleException('Could not create E2E service output directory', exception)
        }

        List<String> command = new ArrayList<>()
        command.add(javaExecutable.get().asFile.absolutePath)
        command.addAll(jvmArgs.get())
        command.add('-jar')
        command.add(jar.toString())

        Process process
        try {
            ProcessBuilder builder = new ProcessBuilder(command)
                    .redirectErrorStream(true)
                    .redirectOutput(ProcessBuilder.Redirect.to(log.toFile()))
            builder.environment().putAll(environment.get())
            process = builder.start()
            Files.writeString(pid, Long.toString(process.pid()) + System.lineSeparator(), StandardCharsets.UTF_8)
        } catch (IOException exception) {
            deletePid(pid)
            throw new GradleException("Could not start E2E service; see ${log}", exception)
        }

        long deadline = System.nanoTime() + timeout.toNanos()
        HttpClient client = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(2)).build()
        try {
            while (System.nanoTime() < deadline) {
                if (!process.alive) {
                    int exitCode = process.exitValue()
                    deletePid(pid)
                    throw new GradleException("E2E service exited with code ${exitCode} before becoming healthy; see ${log}")
                }
                if (isHealthy(client, healthUri)) {
                    logger.lifecycle('E2E service is healthy at {} (PID {})', healthUri, process.pid())
                    return
                }
                Thread.sleep(250)
            }
        } catch (InterruptedException exception) {
            Thread.currentThread().interrupt()
            ServiceProcessSupport.terminate(process.toHandle(), Duration.ofSeconds(5))
            deletePid(pid)
            throw new GradleException("Interrupted while waiting for E2E service health; see ${log}", exception)
        } finally {
            client.close()
        }

        ServiceProcessSupport.terminate(process.toHandle(), Duration.ofSeconds(5))
        deletePid(pid)
        throw new GradleException("E2E service did not become healthy at ${healthUri} within ${timeout}; see ${log}")
    }

    private static boolean isHealthy(HttpClient client, URI uri) {
        try {
            HttpRequest request = HttpRequest.newBuilder(uri)
                    .timeout(Duration.ofSeconds(2))
                    .GET()
                    .build()
            int status = client.send(request, HttpResponse.BodyHandlers.discarding()).statusCode()
            return status >= 200 && status < 300
        } catch (IOException ignored) {
            return false
        } catch (InterruptedException exception) {
            Thread.currentThread().interrupt()
            throw new GradleException('Interrupted while checking E2E service health', exception)
        }
    }

    private static void deletePid(Path pid) {
        try {
            Files.deleteIfExists(pid)
        } catch (IOException exception) {
            throw new GradleException("Could not remove service PID file ${pid}", exception)
        }
    }
}

@DisableCachingByDefault(because = 'Stops an external service process')
abstract class StopE2eServiceTask extends DefaultTask {
    @Internal
    abstract RegularFileProperty getServiceJar()

    @Internal
    abstract RegularFileProperty getPidFile()

    @TaskAction
    void stopService() {
        Path pid = pidFile.get().asFile.toPath()
        Optional<Long> recordedPid = ServiceProcessSupport.readPid(pid)
        if (recordedPid.empty) {
            logger.lifecycle('E2E service is already stopped')
            return
        }

        long value = recordedPid.get()
        Optional<ProcessHandle> process = ProcessHandle.of(value)
        if (process.empty || !process.get().alive) {
            deletePid(pid)
            logger.lifecycle('Removed stale E2E service PID {}', value)
            return
        }

        Path expectedJar = serviceJar.get().asFile.toPath().toAbsolutePath().normalize()
        if (!ServiceProcessSupport.ownsJar(process.get(), expectedJar)) {
            throw new GradleException("Refusing to stop PID ${value} because it is not the service launched from ${expectedJar}")
        }

        ServiceProcessSupport.terminate(process.get(), Duration.ofSeconds(10))
        deletePid(pid)
        logger.lifecycle('Stopped E2E service PID {}', value)
    }

    private static void deletePid(Path pid) {
        try {
            Files.deleteIfExists(pid)
        } catch (IOException exception) {
            throw new GradleException("Could not remove service PID file ${pid}", exception)
        }
    }
}
