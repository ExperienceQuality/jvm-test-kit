name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Validate tag and protected-main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate immutable release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ./gradlew --no-daemon -q verifyReleaseVersion -PreleaseVersion="$VERSION"
          PROJECT_VERSION="$(./gradlew --no-daemon -q properties -PreleaseVersion="$VERSION" | awk '/^version:/{print $2; exit}')"
          test "$PROJECT_VERSION" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Reject existing package version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api --silent "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/maven/jvm-test-kit/versions" --paginate --jq '.[].name' | grep -Fxq "$VERSION"; then
            echo "Maven version already exists: $VERSION" >&2
            exit 1
          fi
      - name: Run verification and compatibility checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon clean check cyclonedxBom -x japicmp -PreleaseVersion="$VERSION"
      - name: Run API compatibility when baseline exists
        run: |
          if [[ -n "${JAPICMP_BASELINE:-}" ]]; then
            ./gradlew --no-daemon japicmp -PjapicmpBaseline="$JAPICMP_BASELINE"
          else
            echo 'No japicmp baseline configured; first-release compatibility gate is visible and skipped.'
          fi
      - name: Publish isolated consumer artifact
        env:
          LOCAL_M2: ${{ runner.temp }}/xq-m2
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$LOCAL_M2"
          ./gradlew --no-daemon publishMavenJavaPublicationToMavenLocal -PreleaseVersion="$VERSION" -Dmaven.repo.local="$LOCAL_M2"
          ./gradlew --no-daemon -p fixtures/clean-consumer clean check -PkitVersion="$VERSION" -Dmaven.repo.local="$LOCAL_M2"
      - name: Sanitize JUnit reports
        if: always()
        run: python3 ci/sanitize_junit.py build/test-results .ci-evidence/test-results
      - name: Publish package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon publish -PreleaseVersion="$VERSION"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/libs/*.jar
            build/publications/mavenJava/*.pom
            build/publications/mavenJava/*.module
            build/reports/bom/*.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            .ci-evidence/test-results
            build/reports
            build/libs/*.jar
            build/publications/mavenJava
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
