plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':test-kit')
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('io.cucumber:cucumber-bom:8.0.2')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework:spring-test'
    testRuntimeOnly 'io.cucumber:cucumber-junit-platform-engine'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

test {
    useJUnitPlatform()
    environment 'XQ_CUCUMBER_EVENTS_FILE', layout.buildDirectory.file('cucumber-events.ndjson').get().asFile.absolutePath
}
