plugins {
    id 'xq.java-conventions'
}

dependencies {
    testImplementation project(':test-kit')
    testImplementation(platform(libs.junit.bom)) { endorseStrictVersions() }
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation(platform(libs.cucumber.bom)) { endorseStrictVersions() }
    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.spring
    testImplementation(platform(libs.spring.boot.dependencies)) { endorseStrictVersions() }
    testImplementation libs.spring.boot.test
    testImplementation libs.spring.test
    testRuntimeOnly libs.cucumber.junit.platform.engine
}

test {
    environment 'XQ_CUCUMBER_EVENTS_FILE', layout.buildDirectory.file('cucumber-events.ndjson').get().asFile.absolutePath
}
