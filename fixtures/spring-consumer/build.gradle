import org.gradle.authentication.http.BasicAuthentication

plugins {
    id 'java'
}

repositories {
    def testRepository = providers.gradleProperty('testRepository')
    if (!testRepository.isPresent()) {
        throw new GradleException('testRepository must point to the isolated JVM Test Kit Maven repository')
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'JvmTestKitTestRepository'
                url = uri(testRepository.get())
                authentication {
                    basic(BasicAuthentication)
                }
                credentials {
                    username = providers.environmentVariable('GITHUB_ACTOR').orNull
                    password = providers.environmentVariable('GITHUB_TOKEN').orNull
                }
            }
        }
        filter { includeGroup 'com.xq' }
    }
    mavenCentral()
}

def kitVersion = providers.gradleProperty('kitVersion').orElse('3.0.0-dev').get()

dependencies {
    testImplementation "com.xq:jvm-test-kit-spring:${kitVersion}"
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('io.cucumber:cucumber-bom:8.0.2')
    testImplementation 'io.cucumber:cucumber-java'
    testRuntimeOnly 'io.cucumber:cucumber-junit-platform-engine'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

test {
    useJUnitPlatform()
    environment 'XQ_TEST_BASE_URL', 'http://127.0.0.1:18082/'
    environment 'XQ_CUCUMBER_EVENTS_FILE', layout.buildDirectory.file('cucumber-events.ndjson').get().asFile.absolutePath
}
