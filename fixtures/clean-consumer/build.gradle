plugins {
    id 'java'
}

repositories {
    def testRepository = providers.gradleProperty('testRepository')
    if (!testRepository.isPresent()) {
        throw new GradleException('testRepository must point to the isolated JVM Test Kit Maven repository')
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'JvmTestKitTestRepository'
                url = uri(testRepository.get())
                def actor = providers.environmentVariable('GITHUB_ACTOR')
                def token = providers.environmentVariable('GITHUB_TOKEN')
                if (url.scheme in ['http', 'https'] && actor.isPresent() && token.isPresent()) {
                    credentials {
                        username = actor.get()
                        password = token.get()
                    }
                }
            }
        }
        filter {
            includeGroup 'com.xq'
        }
    }
    mavenCentral()
}

def kitVersion = providers.gradleProperty('kitVersion').orElse('3.0.0-dev').get()

dependencies {
    testImplementation "com.xq:jvm-test-kit:${kitVersion}"
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}
