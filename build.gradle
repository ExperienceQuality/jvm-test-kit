plugins {
    id 'base'
}

group = 'com.xq'
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .orElse('3.0.0-dev')
        .get()

description = 'Aggregates the JVM Test Kit library and service Gradle plugin.'

tasks.named('clean') {
    dependsOn ':test-kit:clean', ':service-plugin:clean', ':spring-consumer:clean'
}

tasks.named('assemble') {
    dependsOn ':test-kit:assemble', ':service-plugin:assemble', ':spring-consumer:assemble'
}

tasks.named('check') {
    dependsOn ':test-kit:check', ':service-plugin:check', ':spring-consumer:check'
}

tasks.register('verifyAll') {
    description = 'Runs verification for the JVM Test Kit library and service Gradle plugin.'
    group = 'verification'
    dependsOn ':test-kit:check', ':service-plugin:check', ':spring-consumer:check',
            ':service-plugin:validatePlugins'
}
