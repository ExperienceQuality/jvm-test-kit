plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.cyclonedx.bom' version '2.3.1'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
}

group = 'com.xq'
def kitVersion = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .orElse('1.0-SNAPSHOT')
version = kitVersion.get()

def semver = ~/\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?/

tasks.register('verifyReleaseVersion') {
    doLast {
        if (!semver.matcher(project.version.toString()).matches()) {
            throw new GradleException("releaseVersion must be SemVer (for example 1.2.3): ${project.version}")
        }
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException("releaseVersion must not be a SNAPSHOT: ${project.version}")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.swagger.parser.v3:swagger-parser:2.1.37'
    implementation 'org.testcontainers:postgresql:1.20.6'

    api platform('org.junit:junit-bom:6.0.0')
    api 'org.junit.jupiter:junit-jupiter-api'

    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'XQ JVM Test Kit'
                description = 'JVM service-test kit with JUnit Jupiter support'
                url = 'https://github.com/ExperienceQuality/jvm-test-kit'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ExperienceQuality/jvm-test-kit.git'
                    developerConnection = 'scm:git:ssh://github.com/ExperienceQuality/jvm-test-kit.git'
                    url = 'https://github.com/ExperienceQuality/jvm-test-kit'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').orNull
                password = providers.environmentVariable('GITHUB_TOKEN').orNull
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('verifyReleaseVersion')
}

tasks.register('japicmp', me.champeau.gradle.japicmp.JapicmpTask) {
    description = 'Checks binary compatibility against -PjapicmpBaseline=/path/to/previous.jar.'
    onlyModified = true
    onlyBinaryIncompatibleModified = true
    reportOnlySummary = true
    ignoreMissingClasses = true
    newArchives.from(tasks.named('jar'))
    def baseline = providers.gradleProperty('japicmpBaseline')
    oldArchives.from(baseline.map { file(it) })
    onlyIf { baseline.isPresent() }
}

tasks.named('check') {
    dependsOn tasks.named('japicmp')
}

test {
    useJUnitPlatform()
    exclude '**/XqExtensionContractTest$*.class'
}
