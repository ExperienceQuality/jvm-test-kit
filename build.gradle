plugins {
    id 'base'
}

group = 'com.xq'
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .orElse('3.0.0-dev')
        .get()

description = 'Aggregates the JVM Test Kit library and service Gradle plugin.'

tasks.named('clean') {
    dependsOn ':test-kit:clean', ':service-plugin:clean', ':spring-adapter:clean'
}

tasks.named('assemble') {
    dependsOn ':test-kit:assemble', ':service-plugin:assemble', ':spring-adapter:assemble'
}

tasks.named('check') {
    dependsOn ':test-kit:check', ':service-plugin:check', ':spring-adapter:check'
}

tasks.register('verifyAll') {
    description = 'Runs verification for both independently versioned products.'
    group = 'verification'
    dependsOn ':test-kit:check', ':service-plugin:check', ':spring-adapter:check', ':service-plugin:validatePlugins'
}

def libraryTaskAliases = [
        buildDependents                                  : 'build',
        buildNeeded                                      : 'build',
        classes                                          : 'classes',
        compileJava                                      : 'compileJava',
        compileTestJava                                  : 'compileTestJava',
        cyclonedxBom                                     : 'cyclonedxBom',
        generateMetadataFileForMavenJavaPublication      : 'generateMetadataFileForMavenJavaPublication',
        generatePomFileForMavenJavaPublication           : 'generatePomFileForMavenJavaPublication',
        japicmp                                          : 'japicmp',
        jar                                               : 'jar',
        javadoc                                           : 'javadoc',
        processResources                                  : 'processResources',
        processTestResources                              : 'processTestResources',
        publish                                           : 'publish',
        publishAllPublicationsToGitHubPackagesRepository  : 'publishAllPublicationsToGitHubPackagesRepository',
        publishAllPublicationsToTestRepository            : 'publishAllPublicationsToTestRepository',
        publishMavenJavaPublicationToGitHubPackagesRepository: 'publishMavenJavaPublicationToGitHubPackagesRepository',
        publishMavenJavaPublicationToMavenLocal           : 'publishMavenJavaPublicationToMavenLocal',
        publishMavenJavaPublicationToTestRepository       : 'publishMavenJavaPublicationToTestRepository',
        publishToMavenLocal                               : 'publishToMavenLocal',
        sourcesJar                                        : 'sourcesJar',
        test                                              : 'test',
        testClasses                                       : 'testClasses',
        verifyReleaseVersion                              : 'verifyReleaseVersion'
]

libraryTaskAliases.each { aliasName, targetName ->
    tasks.register(aliasName) {
        description = "Delegates to :test-kit:${targetName}."
        group = targetName.startsWith('publish') || targetName.startsWith('generate')
                ? 'publishing'
                : targetName in ['check', 'japicmp', 'test', 'verifyReleaseVersion']
                ? 'verification'
                : 'build'
        dependsOn ":test-kit:${targetName}"
    }
}
