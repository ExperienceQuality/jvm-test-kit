plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'xq.publishing-conventions'
}

group = 'com.xq.jvm-test-kit'
version = providers.gradleProperty('pluginVersion')
        .orElse(providers.environmentVariable('PLUGIN_VERSION'))
        .orElse('0.1.0-dev')
        .get()

repositories {
    gradlePluginPortal()
}

dependencies {
    implementation localGroovy()
    implementation libs.spring.boot.gradle.plugin
    implementation libs.spring.dependency.management.plugin

    testImplementation(platform(libs.junit.bom)) { endorseStrictVersions() }
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

gradlePlugin {
    plugins {
        serviceConventions {
            id = 'com.xq.jvm-test-kit.service-plugin'
            implementationClass = 'com.xq.jvmtestkit.gradle.ServiceConventionsPlugin'
            displayName = 'XQ Service Conventions'
            description = 'Shared Java 21 and Spring Boot service build conventions'
        }
    }
}

tasks.register('verifyPluginVersion', com.xq.jvmtestkit.conventions.VerifyReleaseVersion) {
    versionProperty = 'pluginVersion'
    exampleVersion = '1.2.3'
    candidate = project.version.toString()
}

publishing.publications.withType(MavenPublication).configureEach {
    pom {
        name = 'XQ Service Gradle Plugin'
        description = 'Shared Java 21 and Spring Boot service build conventions'
    }
}

def generatedVersionsDirectory = layout.buildDirectory.dir('generated/plugin-versions')
def generatePluginVersions = tasks.register('generatePluginVersions', WriteProperties) {
    description = 'Writes the dependency versions the plugin adds to consumer builds.'
    destinationFile = generatedVersionsDirectory.map {
        it.file('com/xq/jvmtestkit/gradle/plugin-versions.properties')
    }
    property 'java', libs.versions.java.get()
    property 'junit', libs.versions.junit.get()
    property 'cucumber', libs.versions.cucumber.get()
    property 'springBoot', libs.versions.spring.boot.get()
    property 'jvmTestKit', libs.versions.jvm.test.kit.plugin.default.get()
}
sourceSets.main.resources.srcDir(files(generatedVersionsDirectory).builtBy(generatePluginVersions))

tasks.named('test') {
    def prebuiltPluginRepository = providers.gradleProperty('prebuiltPluginRepository')
    if (prebuiltPluginRepository.isPresent()) {
        systemProperty 'xq.plugin.testRepository', prebuiltPluginRepository.get()
    } else {
        dependsOn tasks.named('publishAllPublicationsToTestRepository')
        systemProperty 'xq.plugin.testRepository', xqPublishing.testRepository.get().asFile.absolutePath
    }
    systemProperty 'xq.plugin.version', project.version.toString()
    systemProperty 'xq.plugin.consumerGradleVersion', libs.versions.consumer.gradle.get()
}
