plugins {
    id 'java-library'
    id 'xq.publishing-conventions'
    alias(libs.plugins.cyclonedx)
    alias(libs.plugins.japicmp)
}

group = 'com.xq'
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .orElse('3.0.0-dev')
        .get()

base {
    archivesName = 'jvm-test-kit'
}

tasks.register('verifyReleaseVersion', com.xq.jvmtestkit.conventions.VerifyReleaseVersion) {
    versionProperty = 'releaseVersion'
    exampleVersion = '3.0.3'
    candidate = project.version.toString()
}

repositories {
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
        content {
            includeGroup 'com.xq'
        }
        credentials {
            username = providers.environmentVariable('GITHUB_ACTOR').orNull
            password = providers.environmentVariable('GITHUB_TOKEN').orNull
        }
    }
}

configurations {
    japicmpBaseline {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    api(platform(libs.cucumber.bom)) { endorseStrictVersions() }
    api libs.cucumber.java
    api libs.cucumber.plugin
    compileOnly(platform(libs.spring.boot.dependencies)) { endorseStrictVersions() }
    compileOnly libs.cucumber.spring
    compileOnly libs.spring.boot.test
    compileOnly libs.spring.test
    api(platform(libs.junit.bom)) { endorseStrictVersions() }
    api libs.junit.jupiter.api

    api libs.jackson.databind
    api libs.assertj.core
    api libs.wiremock.standalone
    implementation libs.json.unit.assertj
    implementation libs.aeonbits.owner

    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testImplementation libs.junit.platform.launcher
    testImplementation(platform(libs.cucumber.bom)) { endorseStrictVersions() }
    testImplementation libs.cucumber.spring
    testImplementation(platform(libs.spring.boot.dependencies)) { endorseStrictVersions() }
    testImplementation libs.spring.boot.test
    testImplementation libs.spring.test

    japicmpBaseline libs.jvm.test.kit.baseline
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'jvm-test-kit'
            pom {
                name = 'XQ JVM Test Kit'
                description = 'Minimal JVM service E2E test kit with JUnit Jupiter support'
            }
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.GenerateMavenPom).configureEach {
    destination = layout.buildDirectory.file("publications/mavenJava/jvm-test-kit-${project.version}.pom").get().asFile
}

tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
    outputFile = layout.buildDirectory.file("publications/mavenJava/jvm-test-kit-${project.version}.module")
}

tasks.register('japicmp', me.champeau.gradle.japicmp.JapicmpTask) {
    description = "Checks binary compatibility against released com.xq:jvm-test-kit:${libs.versions.jvm.test.kit.baseline.get()}."
    onlyModified = false
    onlyBinaryIncompatibleModified = true
    reportOnlySummary = true
    def baselineMajor = libs.versions.jvm.test.kit.baseline.get().tokenize('.')[0].toInteger()
    def major = project.version.toString().tokenize('.')[0].toInteger()
    // Releases on the baseline's major line must stay binary compatible. CI
    // builds 0.0.0-ci.* versions of that same line, so gate them too. A new
    // major version is not gated until the baseline moves to its first release.
    failOnModification = major == baselineMajor || major == 0
    ignoreMissingClasses = true
    txtOutputFile = layout.buildDirectory.file('reports/japicmp/report.txt')
    newArchives.from(tasks.named('jar'))
    oldArchives.from(configurations.japicmpBaseline)
}

tasks.named('check') {
    dependsOn tasks.named('japicmp')
}

tasks.named('cyclonedxBom', org.cyclonedx.gradle.CycloneDxTask) {
    destination = layout.buildDirectory.dir('reports/bom').get().asFile
}
