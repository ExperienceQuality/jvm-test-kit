plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.cyclonedx.bom' version '2.3.1'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
}

group = 'com.xq'
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .orElse('3.0.0-dev')
        .get()

base {
    archivesName = 'jvm-test-kit'
}

layout.buildDirectory.set(rootProject.layout.buildDirectory)

def semver = ~/\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?/
def testRepositoryPath = providers.gradleProperty('testRepository').orNull
def testRepositoryDirectory = testRepositoryPath == null
        ? layout.buildDirectory.dir('test-repository').get().asFile
        : file(testRepositoryPath)

tasks.register('verifyReleaseVersion') {
    doLast {
        String candidate = project.version.toString()
        if (!semver.matcher(candidate).matches()) {
            throw new GradleException("releaseVersion must be SemVer (for example 2.0.0): ${candidate}")
        }
        if (candidate.endsWith('-SNAPSHOT')) {
            throw new GradleException("releaseVersion must not be a SNAPSHOT: ${candidate}")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
        content {
            includeGroup 'com.xq'
        }
        credentials {
            username = providers.environmentVariable('GITHUB_ACTOR').orNull
            password = providers.environmentVariable('GITHUB_TOKEN').orNull
        }
    }
}

configurations {
    japicmpBaseline {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    api platform('io.cucumber:cucumber-bom:8.0.2')
    api 'io.cucumber:cucumber-java'
    api 'io.cucumber:cucumber-plugin'
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    compileOnly 'io.cucumber:cucumber-spring'
    compileOnly 'org.springframework.boot:spring-boot-test'
    compileOnly 'org.springframework:spring-test'
    api platform('org.junit:junit-bom:6.0.0')
    api 'org.junit.jupiter:junit-jupiter-api'

    api 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
    api 'org.assertj:assertj-core:3.27.6'
    implementation 'net.javacrumbs.json-unit:json-unit-assertj:4.1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('io.cucumber:cucumber-bom:8.0.2')
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework:spring-test'

    japicmpBaseline 'com.xq:jvm-test-kit:2.0.0'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'jvm-test-kit'
            pom {
                name = 'XQ JVM Test Kit'
                description = 'Minimal JVM service E2E test kit with JUnit Jupiter support'
                url = 'https://github.com/ExperienceQuality/jvm-test-kit'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ExperienceQuality/jvm-test-kit.git'
                    developerConnection = 'scm:git:ssh://github.com/ExperienceQuality/jvm-test-kit.git'
                    url = 'https://github.com/ExperienceQuality/jvm-test-kit'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'Test'
            url = testRepositoryDirectory
        }
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/ExperienceQuality/jvm-test-kit')
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').orNull
                password = providers.environmentVariable('GITHUB_TOKEN').orNull
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('verifyReleaseVersion')
}

tasks.withType(org.gradle.api.publish.maven.tasks.GenerateMavenPom).configureEach {
    destination = layout.buildDirectory.file("publications/mavenJava/jvm-test-kit-${project.version}.pom").get().asFile
}

tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
    outputFile = layout.buildDirectory.file("publications/mavenJava/jvm-test-kit-${project.version}.module")
}

tasks.register('japicmp', me.champeau.gradle.japicmp.JapicmpTask) {
    description = 'Checks binary compatibility against released com.xq:jvm-test-kit:2.0.0.'
    onlyModified = false
    onlyBinaryIncompatibleModified = true
    reportOnlySummary = true
    def major = project.version.toString().tokenize('.')[0].toInteger()
    // v3 intentionally breaks the v2 public API. CI uses 0.0.0-ci.* staging
    // versions, so gate only v2 releases instead of treating CI as v2.
    failOnModification = major == 2
    ignoreMissingClasses = true
    txtOutputFile = layout.buildDirectory.file('reports/japicmp/report.txt')
    newArchives.from(tasks.named('jar'))
    oldArchives.from(configurations.japicmpBaseline)
}

tasks.named('check') {
    dependsOn tasks.named('japicmp')
}

tasks.named('cyclonedxBom', org.cyclonedx.gradle.CycloneDxTask) {
    destination = layout.buildDirectory.dir('reports/bom').get().asFile
}

test {
    useJUnitPlatform()
}
